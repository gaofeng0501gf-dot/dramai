# dramai-kling-proxy：Kling 官方 API 的 CORS 安全中转
#
# ⚠️ 不要在这里写任何 Secret。
#    KLING_API_KEY 和 PROXY_TOKEN 只能用下面的命令设置（加密保存在 Cloudflare）：
#      npx wrangler secret put KLING_API_KEY
#      npx wrangler secret put PROXY_TOKEN

name = "dramai-kling-proxy"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Worker 仅打印不包含密钥/图片/提示词的阶段日志。启用控制台日志便于诊断。
[observability]
enabled = true

# 私有 R2 存储桶：需要在 Cloudflare 控制台先创建，再绑定到现有 Worker。
# 手动在网页编辑 Worker 时，也必须在 Settings -> Bindings 配置同名绑定。
[[r2_buckets]]
binding = "OMNI_ASSETS"
bucket_name = "dramai-omni-assets"
